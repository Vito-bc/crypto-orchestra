name: CI

on:
  push:
    branches: [main]
  pull_request:
    # A PR into main gets checks regardless of its head branch, so feature
    # branches are covered via their PR.
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install ruff
        # Only ruff — installing the full dependency tree would make linting
        # several minutes slower for no benefit.
        run: pip install ruff
      - name: Lint
        run: ruff check .

  tests:
    # The real quality gate for a trading system: a lint-only workflow would not
    # block a regression in the reconciliation / EXIT / preflight safety tests.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run test suite
        # No secrets are provided on purpose: the suite must pass on a clean
        # checkout with no .env. Agents read ANTHROPIC_API_KEY in __init__ (not at
        # import) and no test imports agents/, so nothing here needs credentials.
        # pyproject sets testpaths=tests and deselects integration tests, which
        # require a live Coinbase candle cache that CI does not have.
        run: python -m pytest -q
